# LANE demo-project-android-settings — THE PRECONDITION, and what you see when it is not met.
#
# `android-settings` is declared `environment: local`, and that declaration is true: the Settings
# app is a first-party system app on the local AVD, so the policy gate allows this run
# credential-free in every execution context. Nothing below is a gate refusal. The owner ruled this
# lane `document-the-refusal` (401-21 Task 3), and what there is to document is the PRECONDITION —
# because that, not the gate, is what actually stops you.
#
# PRECONDITION: an attached Android device or a running emulator (the config expects the
# Medium_Phone_-_API_36.1 AVD), AND Appium installed.
#   adb devices                                  # must list at least one device
#   npm install -D appium                        # or: npm install -g appium
#   npx agent-qa install-mobile-drivers --all
#
# MEASURED on this checkout (401-21 Task 4) with `adb devices` listing none and appium not on PATH.
# Verbatim, so a later wording change reds against this text instead of drifting away from it:
#
#   [appium] Appium not found. Install Appium locally with `npm install -D appium` (or `pnpm add -D appium` / `yarn add -D appium`). If you prefer a machine-wide setup, use `npm install -g appium`.
#   skipped Android Settings search (D-13 mobile loop) (skipped)
#   Framework error: Could not auto-start Appium: Appium server did not become ready within 30000ms
#
# The process exits without ever writing a `run:start` audit row, so there is no gate decision to
# read: this lane stops BEFORE the gate, not at it.
test-id: t_ales-erade-kids-ande-adat-peace-abe-usar-endere-brew
name: Android Settings search (D-13 mobile loop)
target: android-settings
context: >
  D-13 minimal-but-real Android acceptance: drives the system Settings app on the
  local Medium_Phone AVD (no APK build) to exercise the re-derived loop end to end —
  observe (open/verify), act (tap/type), hooks (a before-test setup hook fires), and
  variables (the search term is consumed from {{env:SETTINGS_SEARCH_TERM}}, set by
  Plan 15 via .env or `--var SETTINGS_SEARCH_TERM=Battery`). Steps use large, labeled
  first-party UI so the grounding ladder stays unambiguous. Runs as LOCAL UAT (Plan 15).
use:
  device: medium-phone-avd
# Before-test hook — exercises the hook lifecycle on the mobile loop.
setup:
  - h_hag-digest-sett-mongo-abb-except-lift-hong-bios-client
steps:
  - Verify the Settings home screen is visible
  - Tap the search field at the top of Settings
  - Type "{{env:SETTINGS_SEARCH_TERM}}" into the Settings search field
  - Verify a search result for "{{env:SETTINGS_SEARCH_TERM}}" is visible
