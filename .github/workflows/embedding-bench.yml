name: Embedding Bench

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional candidate ID; blank runs all (policy anchors auto-included)
        required: false
        default: ''
        type: string
      accuracy_only:
        description: Skip hardware-dependent performance constants
        required: false
        default: false
        type: boolean
      offline:
        description: Require selected native model revisions to exist in the restored cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: embedding-bench-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bench:
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            report: ubuntu-latest
          - os: windows-latest
            report: windows-latest
    env:
      AGENT_QA_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/agent-qa/models

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore pinned model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.AGENT_QA_MODEL_CACHE_DIR }}
          key: embedding-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/embedding-bench/package.json', 'tools/embedding-bench/benchmark.config.json', 'tools/embedding-bench/candidates.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build benchmark dependencies
        run: pnpm --filter embedding-bench... --if-present build

      - name: Validate benchmark inputs and runtime
        run: pnpm --filter embedding-bench bench:validate

      - name: Run embedding benchmark
        shell: bash
        env:
          BENCH_CANDIDATE: ${{ inputs.candidate }}
          BENCH_ACCURACY_ONLY: ${{ inputs.accuracy_only }}
          BENCH_OFFLINE: ${{ inputs.offline }}
          BENCH_REPORT: ${{ runner.temp }}/embedding-bench/bench-report-${{ matrix.report }}.json
        run: |
          set -euo pipefail
          args=(--report "$BENCH_REPORT")
          if [[ -n "$BENCH_CANDIDATE" ]]; then
            args+=(--candidate "$BENCH_CANDIDATE")
          fi
          if [[ "$BENCH_ACCURACY_ONLY" == "true" ]]; then
            args+=(--accuracy-only)
          fi
          if [[ "$BENCH_OFFLINE" == "true" ]]; then
            args+=(--offline)
          fi
          pnpm --filter embedding-bench bench -- "${args[@]}"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-bench-${{ runner.os }}
          path: |
            ${{ runner.temp }}/embedding-bench/bench-report-${{ matrix.report }}.json
            ${{ runner.temp }}/embedding-bench/REPORT.md
          if-no-files-found: error
