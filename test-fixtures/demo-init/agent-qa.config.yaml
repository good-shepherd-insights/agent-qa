# agent-qa Configuration

# File discovery and project settings
workspace:
  testMatch:
    - tests/**/*.yaml
  suiteMatch:
    - suites/**/*.suite.yaml
  hooksFile: hooks.yaml
  envFile: .env
  secretsFile: .env.secrets.local
  # Optional: ignore archived or generated tests.
  # testPathIgnore:
  #   - tests/archive/**/*.yaml

  # Infrastructure services (dashboard, MCP, cache, auth state, logging)
services:
  dashboard:
    port: 3100
    artifactsDir: .agent-qa/artifacts
    # Optional: persist dashboard state to a custom SQLite path.
    # dbPath: .agent-qa/dashboard.sqlite
  mcp:
    enabled: true
    transport: http
    host: 127.0.0.1
    port: 3471
    path: /mcp
  cache:
    dir: .agent-qa/cache
    ttl: 7d
  # Accessibility checks power the W3C BAD demo test.
  authState:
    dir: .agent-qa/auth-states
  vision:
    screenshotSize: 256k
    effectiveResolution: 768
  accessibility:
    enabled: true
    standard: wcag2aa
    runAfter: every-step
    failOnViolation: false
  recording:
    enabled: true
  logging:
    level: warn

# Committed knowledge root. Policies now live under this directory rather than
# being referenced through the retired workspace.agentRules key.
knowledge:
  dir: agent-qa-knowledge
  commitArtifacts: none

# Named resource definitions (LLM configs, app targets)
registry:
  # Optional: local and cloud device/provider profiles.
  devices:
    android-emu:
      platform: android
      transport: local
    ios-sim:
      platform: ios
      transport: local
      match:
        automationName: XCUITest
  # providers:
  #   browserstack:
  #     username: ${BROWSERSTACK_USERNAME}
  #     accessKey: ${BROWSERSTACK_ACCESS_KEY}
  llms:
    - name: codex
      provider: openai-subscription
      model: gpt-5.6-terra
      vision: true
    - name: judge
      provider: openai-subscription
      model: gpt-5.6-sol
      vision: true
    - name: claude
      provider: anthropic-compatible
      baseURL: https://api.anthropic.com
      model: claude-sonnet-4-6
      vision: true
  targets:
    # Optional: add more web or mobile targets here.
    # my-mobile:
    #   platform: android
    #   appPackage: com.example.app
    #   appActivity: .MainActivity
    #   app:
    #     path: apps/example.apk
    maps-ios:
      product: apple-maps
      platform: ios
      bundleId: com.apple.Maps
      # A first-party system app on THIS machine's simulator/device — nothing shared.
      environment: local
    example-web:
      platform: web
      url: https://example.com
      environment: shared
    web-form:
      platform: web
      url: https://www.selenium.dev/selenium/web/web-form.html
      environment: shared
    local-form:
      platform: web
      url: http://127.0.0.1:8931/form.html
      # Loopback fixture served by this machine.
      environment: local
    automation-exercise:
      platform: web
      url: https://automationexercise.com
      environment: shared
    wai-bad:
      platform: web
      url: https://www.w3.org/WAI/demos/bad/before/home.html
      environment: shared
    example-android:
      platform: android
      # Local emulator/device; no app install, nothing off this machine.
      environment: local
    example-ios:
      platform: ios
      environment: local
    maps-android:
      product: google-maps
      platform: android
      appPackage: com.google.android.apps.maps
      appActivity: com.google.android.maps.MapsActivity
      # A pre-installed app on the local emulator — the app is a third party's, the DEVICE is ours.
      environment: local

# Optional subscription auth plugin declarations
plugins:
  auth:
    - package: "@vostride/agent-qa-subscription-auth"

# Eval substrate (372 D-03 / 413 D-17): a family-disjoint judge (claude family; planner is
# openai family). The D-10 same-family override is absent = default-off; ROOT-11 refuses any
# baseline recorded under it. D-17 fallback: if no Claude credential exists at replay time,
# delete the judge line and the batch records honest abstention
# (not-invoked{no-judge-configured}).
#
# 2026-09-04 (413-09 STAGE 4): the D-17 FALLBACK IS IN FORCE. `auth status` reads
# `claude [Anthropic-compatible] .. No credential` and `auth test --config claude` prints
# "Testing without a saved credential. / Model not found." — so the `judge: claude` line was
# removed and the whole-corpus baseline records every tie as not-invoked{no-judge-configured}
# with no judge block. ROOT-11 admits this path. Restore the line (and store a console API key
# under the config name `claude`) to record a live family-disjoint baseline instead.
eval: {}

# Execution settings (cascades: global -> suite -> test -> CLI flags)
use:
  browser:
    name: chromium
    headless: true
    viewport:
      width: 1280
      height: 720
  mobile:
    appState: preserve
  timeout:
    step: 20m
    test: 90m
    navigation: 2m
  planner:
    maxSubActions: 10
    previousStepCount: 5
  logCapture:
    console: true
    network: true
  parallel: false
  llm: codex
  # Optional: bind mobile runs to a configured device profile.
  # device: android-emu
