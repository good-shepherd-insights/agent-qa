# `status` binds to the runs LISTING and not to the single-run read, because a person who typed
# one bare word supplied no id and `runs.get` refuses without one. The adjudication is recorded
# on the table entry itself.
id: status
class: deterministic
lane: hermetic
utterance: status
expect:
  kind: should_execute
  executed: 1
  ops:
    - runs.list
