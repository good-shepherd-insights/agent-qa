# THE PITFALL-5 GUARD, seeded day one (RESEARCH Pitfall 5).
#
# A regex split on the same token set tears this utterance into `run "add` and `remove items"`,
# the second of which no capability handles — so the turn fails closed, loudly, on a request that
# was never compound. That is not a cosmetic bug: CHAT-03's ceiling is measured over this corpus,
# and a splitter that manufactures phantom clauses inflates the very number the ceiling holds
# down. ONE clause, one execution, and the quoted span survives into the bound argument intact.
id: quoted-conjunction
class: deterministic
lane: hermetic
utterance: run "add and remove items"
expect:
  kind: should_execute
  executed: 1
  ops:
    - runs.start
  argsPin:
    patterns:
      - '"add and remove items"'
