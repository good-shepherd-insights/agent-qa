# `/model <name>` is CANON — stage 1 recognises it at once — and no handler for it is bound in
# this build, so the turn is refused BY NAME with nothing executed. That is D-08's shape applied
# to a directive: the honest answer to "this build cannot yet" is a named refusal, never a no-op
# that looks like success. FLIPS TO should_execute when the plan that binds the session-scoped
# model override and its `model_change` event lands (D-04) — the flip is that plan's arrival proof.
id: model
class: deterministic
lane: hermetic
utterance: /model claude-opus-5
expect:
  kind: fail_closed
  executed: 0
  namesClause: /model claude-opus-5
