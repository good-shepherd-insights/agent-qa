# 432-13 (D-05/D-14): THE `proposals` INBOX ALIAS IS GONE, and this cell now measures its absence.
#
# Changes apply in the call, so there is no pending-decision inbox for a bare word to route to. The
# table no longer resolves `proposals`; the hermetic lane's tripwire planner cannot route it either,
# so the turn refuses by name with zero executions. 432-17 deleted the inbox and `proposals.list`
# with it, so nothing reads a pre-432 record at all. The id is kept so the retired route stays a
# committed, measured absence rather than a deleted file.
id: proposals
class: deterministic
lane: hermetic
utterance: proposals
expect:
  kind: fail_closed
  executed: 0
  namesClause: proposals
  emitsSessionEvent: mark_unhandled
